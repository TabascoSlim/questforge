services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questforge}
      POSTGRES_DB: ${POSTGRES_DB:-questforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questforge} -d ${POSTGRES_DB:-questforge}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Save XP and streak data to disk so it survives restarts
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  game-engine:
    build: ./game-engine
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_ENGINE_PORT: 8001
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questforge}
      POSTGRES_DB: ${POSTGRES_DB:-questforge}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      GAME_ENGINE_URL: http://game-engine:8001
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_USER_ENABLED: ${DEMO_USER_ENABLED:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@questforge.test}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-questforge-demo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-engine:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
