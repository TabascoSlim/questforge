# One-click setup for the free live demo server on Render (Blueprint).
# The website itself is deployed separately on Vercel from the frontend/ folder.
services:
  - type: web
    name: questforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_USER_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
